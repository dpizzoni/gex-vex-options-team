version: 2.1

# Migración de GitHub Actions a CircleCI (se agotaron los minutos gratis de
# GH Actions). Un único pipeline.parameter `trigger` decide qué workflow
# corre en cada corrida - SIN esto, cualquier Scheduled Pipeline dispara
# TODOS los workflows de este archivo (CircleCI corre todo lo que no tenga
# `when:` en cada pipeline run).
#
# Hay que crear/editar 4 Scheduled Pipelines desde el dashboard de CircleCI
# (Project Settings > Triggers), rama `main`, cada uno con su propio valor
# de "Parameters" (JSON) para que dispare solo su workflow:
#
#   Horario UTC (L-V)   Parameters              Dispara
#   10:31               {"trigger": "morning"}  morning-close (gamma-refresh-morning → fund-flow-refresh, encadenados)
#   15:00               {"trigger": "intraday"} gamma-intraday (gamma-refresh-intraday → fund-flow-refresh, encadenados)
#   20:30 (cierre)      {"trigger": "close"}     daily-close (gamma → fund-flow/COT, encadenados)
#   21:30               {"trigger": "macro"}     macro-liquidity (Fed Liquidity + Flow Score → análisis institucional, encadenados)
#
# El Scheduled Pipeline de 10:31 UTC ya existía (antes disparaba solo
# gamma-intraday con {"trigger": "intraday"}) - hay que editar su Parameters
# a {"trigger": "morning"} para que ahora dispare también el fund-flow de la
# mañana; no hace falta crear un 5to Scheduled Pipeline.
#
# El workflow `macro-liquidity` en sí ya encadena macro-liquidity-refresh →
# institutional-analysis-refresh vía `requires:` (no hace falta un 5to
# trigger horario) - así el agente LLM siempre corre sobre el Flow Score y
# el Fed Liquidity del mismo día, ya frescos.
#
# Variables de entorno a configurar en Project Settings > Environment Variables:
#   UW_EMAIL, UW_PASSWORD  - credenciales de Unusual Whales (gamma + fund-flow)
#   UW_AUTH_STATE_B64      - opcional: sesión (cookies) de UW en base64, seedeada como
#                            auth_state.json al arrancar el job (ver scripts/uw-session.js)
#                            para saltear el login por formulario. No hace falta hoy - los
#                            fallos intermitentes eran una race de hidratación en el chequeo
#                            post-login, ya resuelta con reintentos. Queda como salvavidas
#                            por si en algún momento aparece un bloqueo real del lado de UW.
#   FRED_API_KEY           - key gratuita de FRED (macro-liquidity)
#   ANTHROPIC_API_KEY      - key de Claude (análisis institucional) - si está seteada,
#                            generate-institutional-analysis.js la usa en vez de Gemini
#   GEMINI_API_KEY         - key gratuita de Gemini (fallback si no hay ANTHROPIC_API_KEY)
#   GH_PUSH_TOKEN          - GitHub PAT (repo scope) para poder hacer commit/push
#   GIT_AUTHOR_NAME / GIT_AUTHOR_EMAIL - opcional, si no se usa el default de abajo

parameters:
  trigger:
    type: string
    default: "intraday"

commands:
  push_cache:
    description: "Commit y push de cache/ con rebase seguro sobre main"
    parameters:
      commit_message:
        type: string
    steps:
      - run:
          name: 💾 Commit & Push - <<parameters.commit_message>>
          command: |
            git config user.name "${GIT_AUTHOR_NAME:-circleci-bot}"
            git config user.email "${GIT_AUTHOR_EMAIL:-circleci-bot@users.noreply.github.com}"

            if [ -z "$GH_PUSH_TOKEN" ]; then
              echo "GH_PUSH_TOKEN no configurado, no se puede pushear" >&2
              exit 1
            fi

            git remote set-url origin "https://x-access-token:${GH_PUSH_TOKEN}@github.com/dpizzoni/gex-vex-options-team.git"

            git fetch origin main
            if ! git rebase --autostash origin/main; then
              git rebase --abort || true
              echo "No se pudo rebasear sobre main, aborto el commit." >&2
              exit 1
            fi

            # --autostash restaura los cambios locales con un `stash pop` al
            # final, pero si ese pop tiene conflictos (dos jobs concurrentes
            # tocando el mismo cache/*.json), git lo reporta como warning y
            # deja los cambios en el stash CON marcadores de conflicto en el
            # working tree - sin que el comando `rebase` en sí falle (exit 0
            # igual). Sin este chequeo, esos marcadores se commitean y
            # pusehan tal cual, corrompiendo el JSON. Verificar explícitamente
            # que no haya paths unmerged antes de confiar en el árbol.
            if [ -n "$(git ls-files -u)" ]; then
              echo "El autostash dejó conflictos sin resolver tras el rebase, aborto el commit." >&2
              git status --short >&2
              exit 1
            fi

            git add cache/
            if git diff --cached --quiet; then
              echo "Sin cambios para commitear."
              exit 0
            fi

            git commit -m "<<parameters.commit_message>> [skip ci]"
            git push origin HEAD:main

jobs:
  gamma-refresh:
    docker:
      - image: cimg/node:22.11
    resource_class: medium
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-playwright-{{ checksum "package-lock.json" }}
            - v1-playwright-

      - run:
          name: 📦 Instalar dependencias Node
          command: npm install

      - run:
          name: 🌐 Instalar navegadores Playwright (para UW)
          command: npx playwright install chromium --with-deps

      - save_cache:
          key: v1-playwright-{{ checksum "package-lock.json" }}
          paths:
            - ~/.cache/ms-playwright
            - node_modules

      - run:
          name: 📊 Actualizar Gamma Regime Data
          command: npm run uw:daily:gamma

      - store_artifacts:
          path: debug
          destination: uw-login-debug
          when: always

      - push_cache:
          commit_message: "chore(data): intraday gamma regime refresh"

  fund-flow-refresh:
    docker:
      - image: cimg/node:22.11
    resource_class: medium
    steps:
      - checkout

      # `requires:` only orders job START, not what `checkout` sees - it checks
      # out the commit that triggered the pipeline, not whatever gamma-refresh-close
      # just pushed. Re-sync to origin/main so this job reads today's fresh cache.
      - run:
          name: 🔄 Sincronizar con el push del job anterior
          command: git fetch origin main && git reset --hard origin/main

      - restore_cache:
          keys:
            - v1-playwright-{{ checksum "package-lock.json" }}
            - v1-playwright-

      - run:
          name: 📦 Instalar dependencias Node
          command: npm install

      - run:
          name: 🌐 Instalar navegadores Playwright (para UW)
          command: npx playwright install chromium --with-deps

      - save_cache:
          key: v1-playwright-{{ checksum "package-lock.json" }}
          paths:
            - ~/.cache/ms-playwright
            - node_modules

      - run:
          name: 💰 Actualizar Fund Flow (UW) + COT (CFTC)
          command: npm run fund-flow:daily

      - store_artifacts:
          path: debug
          destination: uw-login-debug
          when: always

      - push_cache:
          commit_message: "chore(data): daily fund-flow & COT capture"

  relative-strength-refresh:
    docker:
      - image: cimg/node:22.11
    resource_class: small
    steps:
      - checkout

      # Same re-sync as fund-flow-refresh/institutional-analysis-refresh: this
      # job needs the cache that fund-flow-refresh just pushed, not the
      # pipeline's original checkout.
      - run:
          name: 🔄 Sincronizar con el push del job anterior
          command: git fetch origin main && git reset --hard origin/main

      - restore_cache:
          keys:
            - v1-node-{{ checksum "package-lock.json" }}
            - v1-node-

      - run:
          name: 📦 Instalar dependencias Node
          command: npm install

      - save_cache:
          key: v1-node-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

      - run:
          name: 📈 Actualizar Fuerza Relativa (Yahoo Finance)
          command: npm run rs:daily

      - run:
          name: 🚨 Evaluar alertas de Fuerza Relativa
          command: npm run rs:alerts:daily

      - run:
          name: 🧺 Actualizar composición ETF (top 10 holdings, ~trimestral)
          command: npm run etf:holdings:daily

      - push_cache:
          commit_message: "chore(data): daily relative strength refresh"

  macro-liquidity-refresh:
    docker:
      - image: cimg/node:22.11
    resource_class: small
    steps:
      - checkout

      - restore_cache:
          keys:
            - v1-node-{{ checksum "package-lock.json" }}
            - v1-node-

      - run:
          name: 📦 Instalar dependencias Node
          command: npm install

      - save_cache:
          key: v1-node-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

      - run:
          name: 💧 Actualizar Fed Liquidity + Institutional Flow Score
          command: npm run macro:full

      - push_cache:
          commit_message: "chore(data): daily macro liquidity & institutional flow score refresh"

  institutional-analysis-refresh:
    docker:
      - image: cimg/node:22.11
    resource_class: small
    steps:
      - checkout

      # Same re-sync as fund-flow-refresh: this job needs the flow score that
      # macro-liquidity-refresh just pushed, not the pipeline's original checkout.
      - run:
          name: 🔄 Sincronizar con el push del job anterior
          command: git fetch origin main && git reset --hard origin/main

      - restore_cache:
          keys:
            - v1-node-{{ checksum "package-lock.json" }}
            - v1-node-

      - run:
          name: 📦 Instalar dependencias Node
          command: npm install

      - save_cache:
          key: v1-node-{{ checksum "package-lock.json" }}
          paths:
            - node_modules

      - run:
          name: 🤖 Generar análisis institucional (LLM)
          command: npm run analysis:daily

      - push_cache:
          commit_message: "chore(data): daily institutional analysis"

workflows:
  gamma-intraday:
    when:
      equal: ["intraday", << pipeline.parameters.trigger >>]
    jobs:
      - gamma-refresh:
          name: gamma-refresh-intraday
      - fund-flow-refresh:
          requires:
            - gamma-refresh-intraday

  morning-close:
    when:
      equal: ["morning", << pipeline.parameters.trigger >>]
    jobs:
      - gamma-refresh:
          name: gamma-refresh-morning
      - fund-flow-refresh:
          requires:
            - gamma-refresh-morning

  daily-close:
    when:
      equal: ["close", << pipeline.parameters.trigger >>]
    jobs:
      - gamma-refresh:
          name: gamma-refresh-close
      - fund-flow-refresh:
          requires:
            - gamma-refresh-close
      - relative-strength-refresh:
          requires:
            - fund-flow-refresh

  macro-liquidity:
    when:
      equal: ["macro", << pipeline.parameters.trigger >>]
    jobs:
      - macro-liquidity-refresh
      - institutional-analysis-refresh:
          requires:
            - macro-liquidity-refresh
