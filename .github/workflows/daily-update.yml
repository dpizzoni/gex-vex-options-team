name: Daily Market Update & UW Capture

# Este workflow se ejecutará automáticamente de lunes a viernes.
# Nota: La hora en el cron se define en UTC.
# 10:25 UTC = 06:25 AM EST (Nueva York) / 07:25 AM (Argentina).
# Es el respaldo del disparo puntual desde Vercel Cron (ver vercel.json); si ese
# falla, este schedule nativo de GitHub corre igual (aunque con posible demora).
on:
  schedule:
    - cron: '25 10 * * 1-5'
  workflow_dispatch: # Esto agrega un botón en GitHub para que puedas forzar la ejecución manualmente

# Damos permiso al bot para que pueda hacer commit y push con los JSON nuevos
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout del código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Necesario para que el bot pueda hacer push sin conflictos

      - name: 🔍 Verificar si ya se ejecutó manualmente hoy
        id: check_today
        run: |
          TODAY=$(date +%Y-%m-%d)
          EVENT_NAME="${{ github.event_name }}"
          echo "Fecha de hoy (UTC): $TODAY"
          echo "Trigger event: $EVENT_NAME"
          
          LAST_RUN=""
          if [ -f "capture_state.json" ]; then
            LAST_RUN=$(date -r capture_state.json +%Y-%m-%d)
            echo "Última ejecución detectada: $LAST_RUN"
          fi
          
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🚀 Ejecución manual detectada. Forzando actualización de los datos."
          elif [ "$LAST_RUN" = "$TODAY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ Ya se ejecutó la captura exitosamente hoy ($TODAY). Saltando ejecución automática."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🚀 No se ha ejecutado hoy o no hay registro. Ejecutando update automático normal."
          fi

      - name: 🟢 Setup Node.js
        if: steps.check_today.outputs.skip == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar dependencias Node
        if: steps.check_today.outputs.skip == 'false'
        run: npm install

      - name: 📦 Cache de navegadores y paquetes apt de Playwright
        # ~/.cache/ms-playwright evita re-descargar el binario de Chromium; /var/cache/apt/archives
        # evita que apt-get vuelva a bajar los .deb de fuentes/librerías del mirror de Ubuntu en
        # cada corrida (esto es lo que se vio lento: 4 corridas/día bajando lo mismo desde cero).
        # apt-get sigue corriendo siempre (el runner es una VM nueva y no puede "instalar" paquetes
        # desde el cache), pero con los .deb ya en disco solo instala en vez de descargar.
        if: steps.check_today.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            /var/cache/apt/archives
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 🌐 Instalar navegadores Playwright (para UW)
        # Vi que tienes playwright en el package.json, esto es crucial para que el scraper funcione en GitHub.
        if: steps.check_today.outputs.skip == 'false'
        run: npx playwright install chromium --with-deps

      - name: 🐍 Setup Python (Opcional)
        # Por si test_yf.py o alguna otra herramienta usa Python
        if: steps.check_today.outputs.skip == 'false'
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # ETAPA 1: Gamma Regime (127 tickers, liviano ~5min, no necesita el server de Next.js
      # porque scrapea UW directo). Va primero y en un step separado con su propio commit,
      # para que un fallo acá no se lleve puesta la captura pesada de OI de la Etapa 2.
      - name: 📊 Etapa 1/2 - Actualizar Gamma Regime Data
        if: steps.check_today.outputs.skip == 'false'
        env:
          UW_EMAIL: ${{ secrets.UW_EMAIL }}
          UW_PASSWORD: ${{ secrets.UW_PASSWORD }}
        run: npm run uw:daily:gamma

      # Un push directo a main mientras este job corre (puede tardar ~1h en total)
      # deja el checkout local desactualizado y el push del siguiente step se
      # rechaza con "fetch first". Rebaseamos primero; si hay un conflicto real
      # de contenido lo abortamos limpio y dejamos que el commit falle visible,
      # en vez de dejar el repo en un estado de rebase a medio terminar.
      - name: 🔄 Sincronizar con main antes de commitear (Gamma)
        if: always() && steps.check_today.outputs.skip == 'false'
        run: |
          git fetch origin main
          if ! git rebase --autostash origin/main; then
            git rebase --abort 2>/dev/null || true
            echo "::warning::No se pudo rebasear sobre main (posible conflicto real de contenido). El commit de Gamma puede fallar."
          fi

      - name: 💾 Commit & Push - Gamma Regime Data
        if: always() && steps.check_today.outputs.skip == 'false'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(data): daily gamma regime capture [skip ci]"
          file_pattern: "cache/"
          skip_fetch: false

      # ETAPA 2: OI + Dealer Build (pesado, ~1h). Corre aunque la Etapa 1 haya fallado
      # (por eso "always()"), ya que sabemos que este pipeline es el más confiable.
      - name: 🚀 Etapa 2/2 - Ejecutar Captura OI y Dealer Build
        if: always() && steps.check_today.outputs.skip == 'false'
        env:
          UW_EMAIL: ${{ secrets.UW_EMAIL }}
          UW_PASSWORD: ${{ secrets.UW_PASSWORD }}
        run: |
          # 1. Levantamos Next.js en el puerto 3002 en el fondo (background)
          npx next dev -p 3002 &

          # 2. Esperamos dinámicamente hasta que la API responda (max 60 segs)
          npx wait-on http://127.0.0.1:3002/api/options?symbol=SPY -t 60000

          # 3. Corremos la recolección
          npm run uw:daily:oi

      - name: 📤 Subir capturas de pantalla de diagnóstico (en caso de error)
        uses: actions/upload-artifact@v6
        if: always() && steps.check_today.outputs.skip == 'false'
        with:
          name: debug-screenshots
          path: debug/
          if-no-files-found: ignore

      - name: 🔄 Sincronizar con main antes de commitear (OI)
        if: always() && steps.check_today.outputs.skip == 'false'
        run: |
          git fetch origin main
          if ! git rebase --autostash origin/main; then
            git rebase --abort 2>/dev/null || true
            echo "::warning::No se pudo rebasear sobre main (posible conflicto real de contenido). El commit de OI puede fallar."
          fi

      - name: 💾 Commit & Push - OI y Dealer Build
        if: always() && steps.check_today.outputs.skip == 'false'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(data): daily UW capture & dealer update [skip ci]"
          file_pattern: "cache/ capture_state.json errors.json"
          skip_fetch: false
