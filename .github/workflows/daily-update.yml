name: Daily Market Update & UW Capture

# Este workflow se ejecutará automáticamente de lunes a viernes.
# Nota: La hora en el cron se define en UTC.
# 10:31 UTC = 06:31 AM EST (Nueva York) / 07:31 AM (Argentina).
# Es el respaldo del disparo puntual desde Vercel Cron (ver vercel.json); si ese
# falla, este schedule nativo de GitHub corre igual (aunque con posible demora).
#
# Solo hace la captura de OI + dealer build (pesada, ~1h). Gamma Regime vivía
# acá como una Etapa 1 previa, pero se movió a gamma-intraday.yml (que ahora
# corre 3 veces/día, incluida la mañana) para que un fallo en cualquiera de
# los dos pipelines no afecte al otro.
on:
  schedule:
    - cron: '31 10 * * 1-5'
  workflow_dispatch: # Esto agrega un botón en GitHub para que puedas forzar la ejecución manualmente

# Evita que el disparo por schedule (nativo de GitHub, con posible demora de
# varios minutos bajo carga) corra en paralelo con el workflow_dispatch de
# Vercel Cron del mismo horario. Sin esto, check_today no alcanza a ver el
# commit del primer run cuando el segundo arranca, ambos capturan casi los
# mismos archivos de cache/dealer/, y el segundo termina pisando un rebase
# fallido (checkout se niega a sobrescribir sus propios archivos untracked)
# seguido de un push non-fast-forward. cancel-in-progress: false porque
# cancelar a mitad de una captura de ~1h dejaría el cache a medio escribir;
# el run duplicado simplemente espera en cola y, al arrancar, check_today ya
# encuentra el commit fresco y se saltea solo.
concurrency:
  group: daily-update-oi
  cancel-in-progress: false

# Damos permiso al bot para que pueda hacer commit y push con los JSON nuevos
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout del código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Necesario para que el bot pueda hacer push sin conflictos

      - name: 🔍 Verificar si ya se ejecutó manualmente hoy
        id: check_today
        run: |
          TODAY=$(date +%Y-%m-%d)
          EVENT_NAME="${{ github.event_name }}"
          echo "Fecha de hoy (UTC): $TODAY"
          echo "Trigger event: $EVENT_NAME"

          # `date -r capture_state.json` used to read this, but actions/checkout
          # always rewrites every file's mtime to "now" regardless of when it was
          # actually committed - so that check read as "today" on literally every
          # single run, including the very first of the day, silently skipping
          # the schedule trigger every time it fired without a same-day manual
          # workflow_dispatch run right before it. The last commit with this
          # message is the real "when did the capture actually last succeed"
          # signal (same idea as src/app/api/data-freshness/route.ts).
          LAST_RUN=$(git log -1 --format=%cs --grep="^chore(data): daily UW capture & dealer update" || true)
          echo "Última ejecución detectada: ${LAST_RUN:-ninguna}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🚀 Ejecución manual detectada. Forzando actualización de los datos."
          elif [ "$LAST_RUN" = "$TODAY" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "✅ Ya se ejecutó la captura exitosamente hoy ($TODAY). Saltando ejecución automática."
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🚀 No se ha ejecutado hoy o no hay registro. Ejecutando update automático normal."
          fi

      - name: 🟢 Setup Node.js
        if: steps.check_today.outputs.skip == 'false'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar dependencias Node
        if: steps.check_today.outputs.skip == 'false'
        run: npm install

      - name: 📦 Cache de navegadores y paquetes apt de Playwright
        # ~/.cache/ms-playwright evita re-descargar el binario de Chromium; /var/cache/apt/archives
        # evita que apt-get vuelva a bajar los .deb de fuentes/librerías del mirror de Ubuntu en
        # cada corrida (esto es lo que se vio lento: 4 corridas/día bajando lo mismo desde cero).
        # apt-get sigue corriendo siempre (el runner es una VM nueva y no puede "instalar" paquetes
        # desde el cache), pero con los .deb ya en disco solo instala en vez de descargar.
        if: steps.check_today.outputs.skip == 'false'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            /var/cache/apt/archives
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 🌐 Instalar navegadores Playwright (para UW)
        # Vi que tienes playwright en el package.json, esto es crucial para que el scraper funcione en GitHub.
        if: steps.check_today.outputs.skip == 'false'
        run: npx playwright install chromium --with-deps

      - name: 🐍 Setup Python (Opcional)
        # Por si test_yf.py o alguna otra herramienta usa Python
        if: steps.check_today.outputs.skip == 'false'
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 🚀 Ejecutar Captura OI y Dealer Build
        if: steps.check_today.outputs.skip == 'false'
        env:
          UW_EMAIL: ${{ secrets.UW_EMAIL }}
          UW_PASSWORD: ${{ secrets.UW_PASSWORD }}
        run: |
          # 1. Levantamos Next.js en el puerto 3002 en el fondo (background)
          npx next dev -p 3002 &

          # 2. Esperamos dinámicamente hasta que la API responda (max 60 segs)
          npx wait-on http://127.0.0.1:3002/api/options?symbol=SPY -t 60000

          # 3. Corremos la recolección
          npm run uw:daily:oi

      - name: 📤 Subir capturas de pantalla de diagnóstico (en caso de error)
        uses: actions/upload-artifact@v6
        if: always() && steps.check_today.outputs.skip == 'false'
        with:
          name: debug-screenshots
          path: debug/
          if-no-files-found: ignore

      - name: 🔄 Sincronizar con main antes de commitear (OI)
        if: always() && steps.check_today.outputs.skip == 'false'
        run: |
          git fetch origin main
          if ! git rebase --autostash origin/main; then
            git rebase --abort 2>/dev/null || true
            echo "::warning::No se pudo rebasear sobre main (posible conflicto real de contenido). El commit de OI puede fallar."
          fi

      - name: 💾 Commit & Push - OI y Dealer Build
        if: always() && steps.check_today.outputs.skip == 'false'
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(data): daily UW capture & dealer update [skip ci]"
          file_pattern: "cache/ capture_state.json errors.json"
          skip_fetch: false
