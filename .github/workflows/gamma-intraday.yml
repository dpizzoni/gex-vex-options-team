name: Gamma Regime Intraday Refresh

# UW recalcula su GEX agregado durante el día (no solo al cierre), así que una
# sola captura diaria quedaba desactualizada para la tarde. Este workflow corre
# SOLO Gamma Regime (liviano, ~5min para 127 tickers) 3 veces por día -
# mañana, tarde y cierre - totalmente desacoplado de la captura de OI (esa
# sigue siendo una vez al día, sola, en daily-update.yml). Antes la corrida de
# la mañana vivía como Etapa 1 dentro de daily-update.yml; se movió acá para
# que un fallo en la captura pesada de OI (Etapa 2) ya no pueda arrastrar a
# Gamma Regime, y viceversa.
# Schedule nativo desactivado: este workflow se está probando migrado a
# CircleCI (ver .circleci/config.yml) porque se agotaron los minutos gratis
# de GitHub Actions. Queda workflow_dispatch para poder forzarlo a mano si
# hace falta volver atrás. Reactivar el `schedule:` de abajo si se decide
# volver a GitHub Actions.
on:
  # schedule:
  #   - cron: '31 10 * * 1-5'
  #   - cron: '0 15 * * 1-5'
  #   - cron: '0 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gamma-refresh:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout del código
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Instalar dependencias Node
        run: npm install

      - name: 📦 Cache de navegadores y paquetes apt de Playwright
        # Ver mismo step en daily-update.yml: evita re-descargar Chromium y los .deb
        # de apt en cada una de las 3 corridas/día de este workflow.
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            /var/cache/apt/archives
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 🌐 Instalar navegadores Playwright (para UW)
        run: npx playwright install chromium --with-deps

      - name: 📊 Actualizar Gamma Regime Data
        env:
          UW_EMAIL: ${{ secrets.UW_EMAIL }}
          UW_PASSWORD: ${{ secrets.UW_PASSWORD }}
        run: npm run uw:daily:gamma

      # Mismo motivo que en daily-update.yml: si algo más se pusheó a main
      # mientras este job corría, evita el "fetch first" en el push siguiente.
      - name: 🔄 Sincronizar con main antes de commitear
        if: always()
        run: |
          git fetch origin main
          if ! git rebase --autostash origin/main; then
            git rebase --abort 2>/dev/null || true
            echo "::warning::No se pudo rebasear sobre main (posible conflicto real de contenido). El commit puede fallar."
          fi

      - name: 💾 Commit & Push - Gamma Regime Data (intraday)
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore(data): intraday gamma regime refresh [skip ci]"
          file_pattern: "cache/"
          skip_fetch: false
